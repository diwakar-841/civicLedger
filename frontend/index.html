<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A secure, wallet-verified blockchain voting system."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Civic Ledger — Blockchain Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  <body class="bg-navy-50">
    <div id="root">
      <div id="initial-loader" style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#eef1f8;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;font-family:Inter,system-ui,sans-serif;">
          <div style="width:36px;height:36px;border-radius:9999px;border:3px solid rgba(223,171,56,0.25);border-top-color:#dfab38;animation:cl-spin 0.8s linear infinite;"></div>
          <p style="margin:0;font-size:13px;color:#5c6fac;">Loading Civic Ledger…</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes cl-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
